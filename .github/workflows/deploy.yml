name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check and offline smoke tests
        run: >-
          npm run check
          && npm run smoke:auth
          && npm run smoke:repositories
          && npm run smoke:canonical
          && npm run smoke:catalog

      # Deploy the code first so the Worker exists before the secret is written.
      # env variables (including the AUTH_TOKEN secret) come from the job-level
      # env block above.
      - name: Deploy Worker
        run: npx wrangler deploy

      # The Cloudflare dashboard Git integration wipes manually-set secrets on
      # every push, so the access token is re-asserted on each deployment.
      # `wrangler secret put` reads the value from stdin and creates a new
      # Worker version immediately. The secrets context is not allowed inside
      # `if:` expressions, so the presence check happens in bash instead.
      - name: Set AUTH_TOKEN secret
        run: |
          if [ -n "${AUTH_TOKEN}" ]; then
            echo "${AUTH_TOKEN}" | npx wrangler secret put AUTH_TOKEN
          else
            echo "AUTH_TOKEN is not configured on GitHub; skipping secret write"
          fi

      # Optional runtime verification. Enable by adding a repository variable
      # MIRROR_DOMAIN (the mirror host without scheme, e.g. mirror.example.com).
      - name: Verify auth gate
        if: ${{ vars.MIRROR_DOMAIN != '' }}
        run: |
          health="$(curl -fsS "https://${MIRROR_DOMAIN}/health")"
          if ! printf '%s' "${health}" | grep -q '"enabled": true'; then
            echo "auth gate is not enabled after deploy"
            printf '%s\n' "${health}"
            exit 1
          fi
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://${MIRROR_DOMAIN}/")"
          if [ "${code}" != "401" ]; then
            echo "expected 401 without a token, got ${code}"
            exit 1
          fi
        env:
          MIRROR_DOMAIN: ${{ vars.MIRROR_DOMAIN }}
